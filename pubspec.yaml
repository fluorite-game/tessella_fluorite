name: tessella_fluorite
description: >-
  Draws a tessella map into a fluorite Filament scene, by consuming tessella's capture stream
  rather than compositing an offscreen surface.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.1.0
  # Used only by hook/build.dart, which is source compatible across every API
  # generation in these ranges, so there is no reason to demand the newest
  # major. Kept wide so pub picks what the surrounding Flutter SDK admits.
  code_assets: ">=0.19.7 <3.0.0"
  hooks: ">=0.20.1 <3.0.0"

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
