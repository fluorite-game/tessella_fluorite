name: tessella_quad
description: Four tessella maps, four ihs platform views, one app.
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  fluorite:
    path: ../../../ihs_filament_view/packages/fluorite
  tessella_fluorite:
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true

# The native half is built by tessella_fluorite's hook, and everything it has to
# locate is host layout. user_defines are the only channel that reaches a hook:
# hooks_runner strips the environment down to a short allow-list.
hooks:
  user_defines:
    # The platform-view seam lives in an ivi-homescreen worktree rather than in
    # the emb overlay, which stages Filament and not the shell. Without this
    # fluorite_register_ihs_pv compiles to its no-op stub and every pane fails
    # with "No platform-view factory registered for view type".
    fluorite:
      # The hook builds fluorite host-native even when the app is being built
      # for a board, and its cmake requires clang -- Filament's archives are
      # libc++. Nothing sets CC/CXX in the subprocess Flutter runs it in, so
      # cmake picks the host default, which on a Fedora host is gcc and stops
      # the whole bundle on "fluorite_core_ffi requires clang (got GNU)". The
      # cross build's library is substituted afterwards; this is only about
      # letting the host one build at all.
      cmake_c_compiler: clang
      cmake_cxx_compiler: clang++
      ihs_dir: /mnt/dev/ivi-homescreen
      # Filament 1.75, not the 1.65.4 the emb overlay stages. fluorite's own
      # sources need it -- GT7 tone mapping, ColorGrading::customLut and the
      # gpuFrameDuration rename are all past 1.65 -- so a build against the
      # overlay fails to compile fluorite itself, before reaching anything here.
      # The staging tree ships a CMake package config, so find_package resolves
      # it from this prefix.
      overlay_prefix: /mnt/dev/maplibre-frontend/filament/build/release/staging
    tessella_fluorite:
      # Relative values resolve against the tessella_fluorite package root, not
      # this app -- the hook protocol does not specify a working directory, so
      # the package it belongs to is the only stable anchor.
      tessella_dir: ../tessella
      # The Filament fluorite actually links. One Filament in the process, so
      # the extension compiles against the headers the host linked; a different
      # release changes Builder::build's constness and the symbols do not
      # resolve -- which is not hypothetical, it is what pointing this at the
      # overlay while fluorite built against 1.75 produced, as an undefined
      # `filament::VertexBuffer::Builder::build` at dlopen. Kept in step with
      # fluorite's overlay_prefix above.
      filament_include: /mnt/dev/maplibre-frontend/filament/build/release/staging/include
      fluorite_include: ../ihs_filament_view/packages/fluorite/include
      # Linked against, so fluorite's symbols resolve under Dart's loader --
      # which opens each native asset RTLD_LOCAL, leaving nothing in the global
      # scope for an undefined reference to find. Any copy with the right
      # soname does for the link; $ORIGIN resolves the bundled one at runtime.
      # Built by fluorite's own hook.
      fluorite_core_ffi: ../ihs_filament_view/packages/fluorite/build/native_assets/linux/libfluorite_core_ffi.so
      # The planet this app reads is served over https. Without `tls` the
      # producer refuses the URL at the status call rather than drawing.
      cargo_features: tls
      # The cross build's library, which the hook publishes rather than builds:
      # emb compiles hooks with gcc and everything above links Filament, which
      # is libc++. Built by .emb/README's two cmake invocations, against the
      # sysroot the rpi5-trixie manifest resolves. Relative to the tessella_fluorite
      # package root, like every other path here. Ignored by a host build.
      prebuilt: build-arm64/current/libtessella_fluorite.so
