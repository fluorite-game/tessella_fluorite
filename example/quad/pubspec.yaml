name: tessella_quad
description: Four tessella maps, four ihs platform views, one app.
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  fluorite:
    path: ../../../ihs_filament_view/packages/fluorite
  tessella_fluorite:
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true

# The native half is built by tessella_fluorite's hook, and everything it has to
# locate is host layout. user_defines are the only channel that reaches a hook:
# hooks_runner strips the environment down to a short allow-list.
hooks:
  user_defines:
    # The platform-view seam lives in an ivi-homescreen worktree rather than in
    # the emb overlay, which stages Filament and not the shell. Without this
    # fluorite_register_ihs_pv compiles to its no-op stub and every pane fails
    # with "No platform-view factory registered for view type".
    fluorite:
      ihs_dir: /mnt/dev/ivi-homescreen
    tessella_fluorite:
      # Relative values resolve against the tessella_fluorite package root, not
      # this app -- the hook protocol does not specify a working directory, so
      # the package it belongs to is the only stable anchor.
      tessella_dir: ../tessella
      # The Filament fluorite actually links, which is the emb overlay's --
      # filament_DIR (a CMake package config) wins over its own
      # FILAMENT_INCLUDE_DIR. One Filament in the process, so the extension
      # compiles against the headers the host linked; a different release
      # changes Builder::build's constness and the symbols do not resolve.
      filament_include: /mnt/dev/ihs_filament_view/.config/flutter_workspace/overlay-x86_64-linux-gnu/usr/include/filament
      fluorite_include: ../ihs_filament_view/packages/fluorite/include
      # Linked against, so fluorite's symbols resolve under Dart's loader --
      # which opens each native asset RTLD_LOCAL, leaving nothing in the global
      # scope for an undefined reference to find. Any copy with the right
      # soname does for the link; $ORIGIN resolves the bundled one at runtime.
      # Built by fluorite's own hook.
      fluorite_core_ffi: ../ihs_filament_view/packages/fluorite/build/native_assets/linux/libfluorite_core_ffi.so
